{{define "content"}}
<div class="pagehead">
  <div>
    <p class="eyebrow">Akun</p>
    <h1>Ganti password</h1>
    <p class="subtitle">Gunakan password yang kuat dan tidak dipakai di layanan lain.</p>
  </div>
</div>

{{with .Error}}<div class="flash flash-danger">{{icon "alert"}}<span>{{.}}</span></div>{{end}}

<section class="card form-card">
  <form method="post" action="/account/password" class="stack">
    {{template "csrf" .Base.CSRF}}
    <label class="field"><span>Password saat ini</span><input type="password" name="current" required autocomplete="current-password"></label>
    <label class="field"><span>Password baru</span><input type="password" name="next" required minlength="8" autocomplete="new-password"><small>Minimal 8 karakter.</small></label>
    <label class="field"><span>Ulangi password baru</span><input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Simpan password</button></div>
  </form>
</section>
{{end}}
